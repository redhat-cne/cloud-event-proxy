apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Plaintext consumer resources shared by both the default deployment and the
# secured overlay. The runtime consumer-sa and its get-Services RBAC live in
# service-account.yaml because they are needed in both modes.
resources:
- namespace.yaml
- service-account.yaml
- service.yaml
- network-policy.yaml
- consumer.yaml
replicas:
- count: 1
  name: cloud-consumer-deployment
images:
- name: cloud-event-consumer
  newName: quay.io/redhat-cne/cloud-event-consumer
  newTag: latest
