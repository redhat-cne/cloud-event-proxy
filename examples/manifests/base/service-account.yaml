apiVersion: v1
kind: ServiceAccount
metadata:
  name: consumer-sa
  namespace: cloud-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-event-consumer
  namespace: openshift-ptp
# The publisher Service name embeds the node name
# (ptp-event-publisher-service-<NODE_NAME>) and is created dynamically per node.
# RBAC resourceNames matches names EXACTLY — it does not expand "*" — so a
# "ptp-event-publisher-service-*" entry would match nothing and every get would
# be Forbidden. Least privilege here is therefore get on Services scoped to the
# openshift-ptp namespace (this Role is namespaced, so it grants no access
# elsewhere). If the node set is fixed and known, tighten this by listing the
# concrete per-node Service names in resourceNames instead.
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-event-consumer
  namespace: openshift-ptp
subjects:
- kind: ServiceAccount
  name: consumer-sa
  namespace: cloud-events
roleRef:
  kind: Role
  name: cloud-event-consumer
  apiGroup: rbac.authorization.k8s.io
