apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default (plaintext) consumer deployment. `make deploy-consumer` renders this:
# the cloud-event-consumer talks to the publisher over plain HTTP, exactly as
# before the mTLS + OAuth work. For the secured (mTLS + OAuth) deployment use
# `make deploy-consumer SECURED=true` (or `make deploy-consumer-secured`), which
# renders the ./secured overlay.
resources:
- base
